plugins {
    id 'java'
    id 'com.azuredoom.hytale-tools'
}

def localProperties = new Properties()
file('gradle.properties').withInputStream { localProperties.load(it) }
def localProperty = { String name -> providers.gradleProperty(name).getOrElse(localProperties.getProperty(name)) }

group = 'com.alechilles'
version = localProperty('mod_version')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

configurations.named('testImplementation') {
    extendsFrom(configurations.compileOnly)
}

hytaleTools {
    hytaleVersion = localProperty('hytale_version')
    patchline = localProperty('hytale_patchline')
    manifestServerVersion = localProperty('hytale_server_version_range')
    manifestGroup = 'Alechilles'
    modId = "Alec's Radial Menu"
    modDescription = 'Standalone radial menu framework for Hytale mods.'
    modCredits = 'Alec (Alechilles)||https://www.curseforge.com/members/alechilles/projects'
    mainClass = 'com.alechilles.radialmenu.RadialMenuMod'
    includesPack = true
    bundleAssetEditorRuntime = false
    manifestDependencies = 'Hytale:AssetModule=*,Hytale:NPC=*'
}

tasks.named('jar') {
    archiveFileName = "Alec's Radial Menu v${project.version}.jar"
    manifest {
        attributes('Plugin-Group': project.group, 'Plugin-Name': project.name, 'Plugin-Version': project.version)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir projectDir
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}
